; AC Black Flag Resynced - HDD Fix / DirectStorage Proxy configuration
; Place this file next to ACBlackFlag.exe and dstorage.dll

[HDDPreloader]
; Enable Level 1: Flag rewriting (FILE_RANDOM_ACCESS -> FILE_SEQUENTIAL_ONLY, clear NO_INTERMEDIATE_BUFFERING)
EnableLevel1 = 1

; Enable Level 2/3: Userland block cache + prefetch (requires EnableLevel1=1)
EnableLevel2 = 0

; Cache size in MB (default: 4096 = 4 GB)
CacheMB = 8192

; Block size in MB (default: 1 = 1 MiB aligned blocks)
BlockMB = 1

; Number of blocks to prefetch ahead on sequential reads (default: 4)
PrefetchBlocks = 4

; Enable logging to DirectStorageProxy.log
EnableLogging = 1
